name: Release APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:
    inputs:
      force_release:
        description: Force build and release even when versionCode did not increase
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-version-change:
    name: Check version change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      new_version_code: ${{ steps.check.outputs.new_version_code }}
      new_version_name: ${{ steps.check.outputs.new_version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if versionCode changed
        id: check
        env:
          FORCE_RELEASE: ${{ github.event.inputs.force_release }}
        run: |
          set -euo pipefail
          CURRENT_VERSION_CODE=$(grep -E 'versionCode = ' app/build.gradle.kts | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          CURRENT_VERSION_NAME=$(grep -E '^val releaseVersionName = "' app/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')
          if [ -z "$CURRENT_VERSION_CODE" ] || [ -z "$CURRENT_VERSION_NAME" ]; then
            echo "::error::Could not read versionCode/releaseVersionName from app/build.gradle.kts"
            exit 1
          fi
          echo "new_version_code=$CURRENT_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "new_version_name=$CURRENT_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT_VERSION_NAME (code: $CURRENT_VERSION_CODE)"

          PREV_VERSION_CODE=""
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            PREV_VERSION_CODE=$(git show HEAD~1:app/build.gradle.kts 2>/dev/null | grep -E 'versionCode = ' | sed 's/.*versionCode = \([0-9]*\).*/\1/' || true)
          fi
          echo "old_version_code=$PREV_VERSION_CODE" >> "$GITHUB_OUTPUT"

          if [ "${FORCE_RELEASE:-false}" = "true" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual force release requested"
          elif [ -z "$PREV_VERSION_CODE" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "Previous commit has no readable version; treating this as the initial release"
          elif [ "$CURRENT_VERSION_CODE" -gt "$PREV_VERSION_CODE" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "Version code increased from $PREV_VERSION_CODE to $CURRENT_VERSION_CODE"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "No version code increase detected"
          fi

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: check-version-change
    if: needs.check-version-change.outputs.version_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Keeps the shared Gradle User Home cache warm for CI runs of pull requests.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/linecode-terminal-extension.keystore
          ls -la signing

      - name: Write signing.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          {
            printf 'storeFile=%s/signing/linecode-terminal-extension.keystore\n' "$GITHUB_WORKSPACE"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > signing.properties

      - name: Validate signing config
        run: ./gradlew :app:validateReleaseSigning

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run lint
        run: ./gradlew :app:lintDebug

      # The embedded runtime assets are committed to the repository and verified by the
      # build's verifyRuntimeAssets task plus the installer-side SHA-256 check.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep -E '^val releaseVersionName = "' app/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode = ' app/build.gradle.kts | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Rename release APK
        run: |
          apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "app/build/outputs/apk/release/LineCode Terminal Extension ${{ steps.version.outputs.version_name }}.APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: LineCode-Terminal-Extension-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.APK
          if-no-files-found: error
          retention-days: 90

      - name: Generate release notes
        id: notes
        env:
          NEW_VERSION_NAME: ${{ needs.check-version-change.outputs.new_version_name }}
        run: |
          # Extract only the block of the released version from update.md.
          if [ -f update.md ]; then
            awk -v target="## v${NEW_VERSION_NAME}" '
              /^## v/ {
                if ($0 == target) { in_block = 1 }
                else if (in_block) { in_block = 0 }
              }
              in_block { print }
            ' update.md > version_notes.md || echo "" > version_notes.md
          else
            echo "" > version_notes.md
          fi

          {
            echo "## LineCode Terminal Extension v${NEW_VERSION_NAME}"
            echo ""
            echo "- Version name: v${NEW_VERSION_NAME}"
            echo "- Version code: ${{ steps.version.outputs.version_code }}"
            echo ""
            if [ -s version_notes.md ]; then
              cat version_notes.md
            else
              echo "### Recent commits"
              git log --oneline HEAD~5..HEAD || echo "No recent commits"
            fi
          } > release_notes.md

          echo "release_notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: LineCode Terminal Extension v${{ steps.version.outputs.version_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup signing files
        if: always()
        run: |
          rm -rf signing
          rm -f signing.properties
