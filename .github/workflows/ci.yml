name: CI

on:
  # Validate the pull request once. A merge to master is handled by Release,
  # so it must not run CI a second time.
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-checks:
    name: CI checks (tests + lint + debug APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Restores the Gradle User Home before the build: the wrapper distribution,
      # downloaded dependencies, compiled build scripts and artifact transforms. The
      # cache is saved again at the end of the job, so later runs only re-run tasks
      # whose inputs changed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache entries written on the default branch are visible to every pull request;
          # fork PRs stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-cleanup: on-success

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify the APK declares the provider contract
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$apk"
          # The embedded runtime must be present and the provider service must be exported
          # with its action and permission, otherwise LineCode cannot discover the extension.
          if ! unzip -l "$apk" | grep -q 'assets/runtime/ubuntu-22.04.5-base-arm64.targz'; then
            echo "::error::The APK is missing the embedded Ubuntu root filesystem."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
